name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/release.yml"
      - ".ai-reviewignore"
      - "LICENSE"
      - "deploy/.env.example"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/release.yml"
      - ".ai-reviewignore"
      - "LICENSE"
      - "deploy/.env.example"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Check web and api
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile --filter lanqin-email-web...

      - name: Check shadcn/ui usage
        run: pnpm --dir apps/web run check:shadcn

      - name: Lint web
        run: pnpm --dir apps/web run lint

      - name: Check formatting
        run: pnpm --dir apps/web run format:check

      - name: Build web
        run: pnpm --dir apps/web run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Check api formatting
        working-directory: apps/api
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: Vet api
        working-directory: apps/api
        run: go vet ./...

      - name: Test api
        working-directory: apps/api
        run: go test ./...

      - name: Check deployment shell scripts
        run: |
          mapfile -t scripts < <(find deploy -name '*.sh' -type f | sort)
          go run mvdan.cc/sh/v3/cmd/shfmt@v3.10.0 -d "${scripts[@]}"
          for script in "${scripts[@]}"; do
            bash -n "$script"
          done
          go run mvdan.cc/sh/v3/cmd/shfmt@v3.10.0 -d .github/scripts/generate-release-notes.sh

      - name: Check release notes generator syntax
        run: bash -n .github/scripts/generate-release-notes.sh

  deploy-image:
    name: Build and validate deployment image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build all-in-one image
        run: docker build -f deploy/all-in-one/Dockerfile -t lanqin-email:ci .

      # 这些配置文件只有真正进镜像才会被验证：nginx/postfix 的语法错误
      # 以前要等到打 tag 出镜像、上线时才暴露。
      - name: Validate bundled configs
        run: |
          docker run --rm --entrypoint sh lanqin-email:ci -c "
            nginx -t &&
            postfix check &&
            doveconf -n >/dev/null &&
            test -s /usr/share/nginx/html/index.html
          "

  compose-config:
    name: Validate compose files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Render compose configs
        run: |
          cd deploy
          cp .env.example .env
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f docker-compose.stack.yml config >/dev/null

services:
  api:
    image: ${LANQIN_API_IMAGE:-ghcr.io/lanqin996/lanqin-email-api:latest}
    env_file: .env
    environment:
      LANQIN_SMTP_HOST: ${LANQIN_STACK_SMTP_HOST:-postfix}
      LANQIN_SMTP_PORT: ${LANQIN_STACK_SMTP_PORT:-25}
      LANQIN_SUBMISSION_ADDR: ${LANQIN_SUBMISSION_ADDR:-}
      LANQIN_SUBMISSION_TLS_ADDR: ${LANQIN_SUBMISSION_TLS_ADDR:-}
    volumes:
      - ./data:/data
      # 不能只读：API 要写已发送副本、草稿、移动/删除邮件。
      - ./mail:/var/mail/vhosts
      # 生产环境如需第三方客户端校验证书，请取消下面挂载的注释，并在 .env 配置：
      # LANQIN_TLS_CERT_FILE=/certs/fullchain.pem
      # LANQIN_TLS_KEY_FILE=/certs/privkey.pem
      # - /etc/letsencrypt/live/${LANQIN_PUBLIC_HOSTNAME}:/certs:ro
    ports:
      - "465:465"
      - "587:587"
    depends_on:
      dovecot:
        condition: service_healthy
      postfix:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl --fail --silent --show-error http://127.0.0.1:8080/readyz >/dev/null'
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  web:
    image: ${LANQIN_WEB_IMAGE:-ghcr.io/lanqin996/lanqin-email-web:latest}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/readyz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  postfix:
    image: ${LANQIN_POSTFIX_IMAGE:-ghcr.io/lanqin996/lanqin-email-postfix:latest}
    env_file: .env
    volumes:
      - ./data:/data
      - ./mail:/var/mail/vhosts
      # 生产环境如需第三方客户端校验证书，请取消下面挂载，并在 .env 配置：
      # - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "25:25"
    depends_on:
      dovecot:
        condition: service_healthy
      rspamd:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "postfix status >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  dovecot:
    image: ${LANQIN_DOVECOT_IMAGE:-ghcr.io/lanqin996/lanqin-email-dovecot:latest}
    env_file: .env
    environment:
      # The API is a separate service here, so the default 127.0.0.1 would resolve to
      # this container and the IMAP/POP3 rate limits would never be enforced.
      LANQIN_AUTH_POLICY_URL: http://api:8080/auth-policy
    volumes:
      - ./data:/data
      - ./mail:/var/mail/vhosts
      # 生产环境如需第三方客户端校验证书，请取消下面挂载，并在 .env 配置：
      # LANQIN_TLS_CERT_FILE=/etc/letsencrypt/live/mail.example.com/fullchain.pem
      # LANQIN_TLS_KEY_FILE=/etc/letsencrypt/live/mail.example.com/privkey.pem
      # - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "993:993"
      - "995:995"
    healthcheck:
      test: ["CMD-SHELL", "doveadm service status >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  rspamd:
    image: ${LANQIN_RSPAMD_IMAGE:-ghcr.io/lanqin996/lanqin-email-rspamd:latest}
    environment:
      # .env 里的 127.0.0.1 在 rspamd 容器里指向它自己；split 部署必须显式指到服务名。
      LANQIN_REDIS_ADDR: redis:6379
      LANQIN_RSPAMD_DNS: ${LANQIN_STACK_RSPAMD_DNS:-127.0.0.11:53}
      LANQIN_DB_PATH: /data/lanqin.db
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      # WAL 模式的 SQLite 即使只读也要在库目录建 -shm；:ro 会让 rspamd
      # 读不到 DKIM 密钥（sync-dkim 报 unable to open database file），
      # 结果所有外发邮件都不签名。
      - ./data:/data
      - ./dkim:/var/lib/rspamd/dkim
    healthcheck:
      test: ["CMD-SHELL", "rspamadm control stat >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  # Rspamd 的后端存储：Bayes 分类器、灰名单、ratelimit、reputation 都依赖它。
  # 没有它 rspamd 会在启动日志里刷 cannot init redis backend，然后静默降级。
  # 不映射端口，只在 compose 网络内给 rspamd 用。
  redis:
    image: ${LANQIN_REDIS_IMAGE:-redis:8-alpine}
    # appendonly 落盘：不然重建容器时 Bayes 攒的学习样本全丢，又得从 200 封重新数
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    volumes:
      - ./redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: unless-stopped

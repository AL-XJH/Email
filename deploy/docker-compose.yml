services:
  lanqin-email:
    image: ${LANQIN_IMAGE:-ghcr.io/lanqin996/lanqin-email:latest}
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "25:25"
      - "465:465"
      - "587:587"
      - "993:993"
      - "995:995"
    volumes:
      - ./data:/data
      - ./mail:/var/mail/vhosts
      - ./dkim:/var/lib/rspamd/dkim
      # 生产环境如需第三方客户端校验证书，请取消下面挂载，并在 .env 配置：
      # - /etc/letsencrypt:/etc/letsencrypt:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error http://127.0.0.1/readyz >/dev/null
          && postfix status >/dev/null 2>&1
          && doveadm service status >/dev/null 2>&1
          && rspamadm control stat >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  # Rspamd 的后端存储：Bayes 分类器、灰名单、ratelimit、reputation 都依赖它。
  # 没有它 rspamd 会在启动日志里刷 cannot init redis backend，然后静默降级。
  # 不映射端口，只在 compose 网络内给 rspamd 用。
  redis:
    image: ${LANQIN_REDIS_IMAGE:-redis:8-alpine}
    # appendonly 落盘：不然重建容器时 Bayes 攒的学习样本全丢，又得从 200 封重新数
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    volumes:
      - ./redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: unless-stopped

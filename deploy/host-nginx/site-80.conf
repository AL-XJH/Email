server {
  listen 80;
  server_name _;

  # ACME HTTP-01 challenge (must not be redirected)
  location /.well-known/acme-challenge/ {
    root /srv/acme;
    default_type "text/plain";
    try_files $uri =404;
  }

  # Everything else -> HTTPS
  location / {
    return 301 https://$host$request_uri;
  }
}

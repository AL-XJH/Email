[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:api]
command=/usr/local/bin/lanqin-api
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=10

[program:dovecot]
command=/usr/sbin/dovecot -F
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=20

[program:rspamd-dkim-sync]
command=/usr/local/bin/lanqin-rspamd-sync-dkim
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=30

[program:redis]
command=/usr/bin/redis-server /etc/redis-lanqin.conf
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=25

[program:rspamd]
command=/bin/sh -c 'if id _rspamd >/dev/null 2>&1; then exec /usr/bin/rspamd -f -u _rspamd -g _rspamd; elif id rspamd >/dev/null 2>&1; then exec /usr/bin/rspamd -f -u rspamd -g rspamd; else exec /usr/bin/rspamd -f --insecure; fi'
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=35

[program:postfix]
# 上次被 kill -9 时 master.pid 会留下来，start-fg 直接 fatal 退出，
# 然后 supervisord 每几秒重试一次，容器看着是 up 的但 SMTP 永远起不来。
command=/bin/sh -c 'rm -f /var/spool/postfix/pid/master.pid; exec /usr/sbin/postfix start-fg'
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=40

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=50

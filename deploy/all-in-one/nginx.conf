server {
  listen 80;

  # Security headers. CSP allows data: frame sources because mail bodies are rendered
  # in a sandboxed srcdoc iframe. Only the Turnstile origin is allowed externally
  # for scripts and challenge frames; keep the remaining policy restrictive.
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-src 'self' data: blob: https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  # Enable once HTTPS is terminated here:
  # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  server_name _;
  client_max_body_size 64m;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://127.0.0.1:8080/api/;
    # /api/events 是 SSE；不开 buffering 会攒到缓冲区满才下发，
    # 新邮件提醒就变成几十秒后才出现（或永远不出现）。
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Must be cleared: the API prefers True-Client-IP when deriving the client
    # address, so a client-supplied value would override X-Real-IP below.
    proxy_set_header True-Client-IP "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /healthz {
    proxy_pass http://127.0.0.1:8080/healthz;
  }

  location = /livez {
    proxy_pass http://127.0.0.1:8080/livez;
  }

  location = /readyz {
    proxy_pass http://127.0.0.1:8080/readyz;
    access_log off;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

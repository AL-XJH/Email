server {
  listen 80;
  access_log /dev/stdout;
  error_log /dev/stderr warn;

  # Security headers. CSP allows data: frame sources because mail bodies are rendered
  # in a sandboxed srcdoc iframe. Only the Turnstile origin is allowed externally
  # for scripts and challenge frames; keep the remaining policy restrictive.
  # add_header 不继承，凡是自带 add_header 的 location 都要再 include 一次。
  include /etc/nginx/snippets/security-headers.conf;

  # 之前完全没开压缩：index-*.js 436KB 原样下发。gzip_static 优先用构建期
  # 预压缩的 .gz（零运行时 CPU），没有 .gz 的响应（含 /api/ JSON）走动态 gzip。
  gzip on;
  gzip_static on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_proxied any;
  gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml application/manifest+json;
  # Enable once HTTPS is terminated here:
  # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  server_name _;
  client_max_body_size 64m;
  root /usr/share/nginx/html;
  index index.html;
  # 静态文件走内核零拷贝；小响应立刻发出去，别等 Nagle。
  tcp_nopush on;
  tcp_nodelay on;
  # 每个资源请求都要 stat 一次；缓存 1000 项、60 秒失效，省掉大部分系统调用。
  open_file_cache max=1000 inactive=60s;
  open_file_cache_valid 30s;
  open_file_cache_min_uses 2;
  open_file_cache_errors on;

  # Vite 产物文件名带内容 hash，可以永久缓存；index.html 反之必须每次回源，
  # 否则发版后用户拿到的还是旧 chunk。
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
    try_files $uri =404;
  }

  # 未带 hash 的小脚本，短缓存 + 允许重验证：发版后最多 5 分钟生效。
  location = /theme-boot.js {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
  }

  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  location /api/ {
    include /etc/nginx/snippets/security-headers.conf;
    # 邮件数据不能进任何中间缓存（浏览器/代理）。
    add_header Cache-Control "no-store" always;
    proxy_pass http://127.0.0.1:8080/api/;
    # /api/events 是 SSE；不开 buffering 会攒到缓冲区满才下发，
    # 新邮件提醒就变成几十秒后才出现（或永远不出现）。
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Must be cleared: the API prefers True-Client-IP when deriving the client
    # address, so a client-supplied value would override X-Real-IP below.
    proxy_set_header True-Client-IP "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /healthz {
    proxy_pass http://127.0.0.1:8080/healthz;
  }

  location = /livez {
    proxy_pass http://127.0.0.1:8080/livez;
  }

  location = /readyz {
    proxy_pass http://127.0.0.1:8080/readyz;
    access_log off;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

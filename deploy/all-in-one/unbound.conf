# Private recursive resolver for the all-in-one mail stack, never a forwarder.
server:
    interface: 127.0.0.1
    port: 5353
    access-control: 127.0.0.0/8 allow
    access-control: 0.0.0.0/0 refuse
    username: unbound
    chroot: ""
    directory: /run/unbound
    pidfile: /run/unbound/unbound.pid
    use-syslog: no
    logfile: ""
    verbosity: 1
    root-hints: /usr/share/dns/root.hints
    auto-trust-anchor-file: /run/unbound/root.key
    do-ip4: yes
    # Docker's default bridge has no IPv6 egress; recurse over IPv4 authorities.
    do-ip6: no
    do-udp: yes
    do-tcp: yes
    num-threads: 1
    msg-cache-size: 8m
    rrset-cache-size: 16m
    edns-buffer-size: 1232
    qname-minimisation: yes
    prefetch: yes
    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    val-permissive-mode: no

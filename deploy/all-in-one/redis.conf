# 单容器模式内嵌的 Redis。
#
# 只给同容器里的 Rspamd 用：bind 在 loopback，不对外，不映射端口。
# daemonize/supervised 都关掉，交给 supervisord 托管。
bind 127.0.0.1 -::1
protected-mode yes
port 6379
daemonize no
supervised no
loglevel notice
logfile ""
databases 16

# AOF 落盘：容器重建时 Bayes 学习样本和灰名单状态不丢。
# 关掉 RDB 快照，避免同一份数据写两遍。
save ""
appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonly"

# 数据量很小（Bayes 分词表通常几 MB），不设 maxmemory，
# 也不做 LRU 淘汰——宁可磁盘涨一点，也不要悄悄把学习样本淘汰掉。
dir /data/redis

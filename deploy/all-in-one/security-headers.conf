# 安全响应头片段。nginx 的 add_header 不会从上层继承：任何 location 里只要
# 出现一条 add_header，server 级的这几条就全部失效。所以需要额外加头的 location
# （/assets/ 的长缓存、/api/ 的 no-store）都要显式 include 本文件。

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-src 'self' data: blob: https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

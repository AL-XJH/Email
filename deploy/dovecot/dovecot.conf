dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

protocols = imap pop3 lmtp
listen = *
base_dir = /var/run/dovecot/

log_path = /dev/stderr
info_log_path = /dev/stdout

ssl = yes
ssl_server_cert_file = /etc/ssl/certs/ssl-cert-snakeoil.pem
ssl_server_key_file = /etc/ssl/private/ssl-cert-snakeoil.key

mail_home = /var/mail/vhosts/%{user | domain}/%{user | username}
mail_driver = maildir
mail_max_userip_connections = 10
recipient_delimiter = +

mail_plugins {
  quota = yes
}

quota_storage_size = 1G
quota "User quota" {
}

sieve_script spam {
  sieve_script_type = before
  driver = file
  path = /etc/dovecot/sieve/spam.sieve
}

auth_policy_server_url = http://127.0.0.1:8080/auth-policy
auth_policy_server_api_header = Content-Type: application/json
# Authentication must not bypass account policy while the API is unavailable.
auth_policy_reject_on_fail = yes
auth_policy_hash_mech = sha256
auth_policy_hash_truncate = 12
auth_policy_hash_nonce = __LANQIN_AUTH_POLICY_HASH_NONCE__
auth_policy_request_attributes {
  login = %{user}
  remote = %{remote_ip}
  protocol = %{protocol}
}

namespace inbox {
  inbox = yes
  mailbox Drafts {
    auto = subscribe
    special_use = \Drafts
  }
  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
  mailbox Trash {
    auto = subscribe
    special_use = \Trash
  }
  mailbox Archive {
    auto = subscribe
    special_use = \Archive
  }
  mailbox Spam {
    auto = subscribe
    special_use = \Junk
  }
}

sql_driver = sqlite
sqlite_path = /data/lanqin.db

passdb sql {
  query = SELECT address AS user, password_hash AS password FROM mailboxes WHERE lower(address)=lower('%{user}') AND status='active'
  default_password_scheme = BLF-CRYPT
}

userdb sql {
  query = SELECT '/var/mail/vhosts/' || d.name || '/' || m.local_part AS home, '/var/mail/vhosts/' || d.name || '/' || m.local_part || '/Maildir' AS mail_path, 5000 AS uid, 5000 AS gid, CAST(m.quota_mb AS TEXT) || 'M' AS quota_storage_size FROM mailboxes m JOIN domains d ON d.id = m.domain_id WHERE d.name = lower('%{user | domain}') AND m.local_part = lower(CASE WHEN instr('%{user | username}', '+') > 0 THEN substr('%{user | username}', 1, instr('%{user | username}', '+') - 1) ELSE '%{user | username}' END) AND m.status = 'active' AND d.status = 'active' UNION SELECT '/var/mail/vhosts/' || lower('%{user | domain}') || '/__unregistered__' AS home, '/var/mail/vhosts/' || lower('%{user | domain}') || '/__unregistered__/Maildir' AS mail_path, 5000 AS uid, 5000 AS gid, '1024M' AS quota_storage_size WHERE EXISTS (SELECT 1 FROM system_settings WHERE key='catchAllEnabled' AND value='true') AND EXISTS (SELECT 1 FROM domains WHERE name=lower('%{user | domain}') AND status='active') AND NOT EXISTS (SELECT 1 FROM mailboxes m JOIN domains d ON d.id=m.domain_id WHERE d.name = lower('%{user | domain}') AND m.local_part = lower(CASE WHEN instr('%{user | username}', '+') > 0 THEN substr('%{user | username}', 1, instr('%{user | username}', '+') - 1) ELSE '%{user | username}' END) AND m.status = 'active')
  iterate_query = SELECT address AS user FROM mailboxes WHERE status = 'active'
}

protocol imap {
  mail_plugins {
    imap_quota = yes
  }
}

protocol pop3 {
}

protocol lmtp {
  mail_plugins {
    sieve = yes
  }
  postmaster_address = postmaster@localhost
  recipient_delimiter = +
  lda_mailbox_autocreate = yes
  lmtp_save_to_detail_mailbox = yes
}

service imap-login {
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

service pop3-login {
  inet_listener pop3s {
    port = 995
    ssl = yes
  }
}

service lmtp {
  inet_listener lmtp {
    port = 24
  }
}

service auth {
  inet_listener postfix-auth {
    port = 12345
  }
}

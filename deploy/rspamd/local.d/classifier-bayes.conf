# 贝叶斯分类器。
#
# backend 必须是 redis：默认的 sqlite/文件后端在多 worker 之间不共享，
# 一重启就归零。
backend = "redis";
new_schema = true;
min_tokens = 11;

# 攒够这么多学习样本之前 Bayes 不出分（spam 和 ham 各自计数）。
# 信箱量小的话这个门槛要留够，否则学两封就开始瞎判。
min_learns = 200;

# 自动学习：rspamd 4.x 原生支持，不需要外部脚本去跑 rspamc learn_*。
#
#   spam_threshold  分数 >= 这个值，当 spam 学
#   junk_threshold  已经被丢进垃圾箱的、分数 >= 这个值，当 spam 学
#   ham_threshold   分数 <= 这个值，当 ham 学
#   check_balance   保持 spam/ham 学习量大致平衡，避免只学一边导致概率失真
#
# 门槛定得比 add_header(6) 高：6~12 分是"不确定"区间，拿这区间去训练等于
# 把自己的犹豫当成标准答案，越学越偏。
autolearn {
  spam_threshold = 12.0;
  junk_threshold = 6.0;
  ham_threshold = 1.0;
  check_balance = true;
  min_balance = 0.9;
}

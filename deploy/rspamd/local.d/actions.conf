# 动作阈值。
#
# 注意这几个数字的实际含义：
#   reject   —— 达到这个分数在 SMTP 阶段直接拒收（会造成退信，慎用）
#   add_header —— 达到这个分数打标记（下游 sieve 依赖这个标记分拣）
#   greylist —— 达到这个分数进灰名单（需要 Redis，且会延迟首次通信的来信）
#
# 这里保持"不拒信、只标记"的保守策略，避免误杀正常邮件。
# 想让 Rspamd 更强硬，把 reject 调低到 15~20 即可；灰名单需要先接上 Redis。
reject = 999;
add_header = 6;
greylist = 999;

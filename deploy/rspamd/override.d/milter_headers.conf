# 把 Rspamd 的判定结果写进邮件头。
#
# Debian 打包的 modules.d/milter_headers.conf 默认是 `use = []`：判定完了一个
# 头都不写。下游（Dovecot sieve、客户端过滤规则、排查日志）因此拿不到任何
# 信号，表现出来就是"Rspamd 明明在跑，却完全没效果"。
#
# 注意 rspamd 3.x 里没有 x-spam / x-spam-score / x-spam-flag 这几个 routine，
# 写进去只会得到 `routine does not exist`；可用的名字见
# /usr/share/rspamd/plugins/milter_headers.lua。
#
# 放在 override.d 而不是 local.d，因为需要整体替换 use 数组而不是追加。
use = ["x-spam-status", "x-spam-level", "x-spamd-bar", "x-spamd-result"];
extended_spam_headers = true;
